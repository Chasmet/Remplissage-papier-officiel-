name: MCP server tests

on:
  push:
    paths:
      - 'supabase/**'
      - '.github/workflows/server-tests.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/server-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-strip-types supabase/functions/remplissage-papier-mcp/session-auth.test.mjs
      - run: node --experimental-strip-types supabase/functions/remplissage-papier-mcp/placement-anchoring.test.mjs
