name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName ['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Impossible de lire versionName dans app/build.gradle"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version détectée: $VERSION"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "Remplissage-papier-officiel-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Remplissage-papier-officiel-APK-v${{ steps.version.outputs.version }}
          path: Remplissage-papier-officiel-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release for in-app update
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          APK="Remplissage-papier-officiel-v${{ steps.version.outputs.version }}.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "Remplissage Papier Officiel $TAG" \
              --notes "Mise à jour Android $TAG. Téléchargeable directement depuis le menu Réglages > Mises à jour de l'application."
          fi
