name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'supabase/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: android-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/.*versionName ['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n "s/.*versionCode[[:space:]]\+\([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n 1)
          if [ -z "$VERSION" ] || [ -z "$VERSION_CODE" ]; then
            echo "Impossible de lire versionName/versionCode dans app/build.gradle"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Version détectée: $VERSION ($VERSION_CODE)"

      - name: Compile, tests and lint
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew clean testDebugUnitTest lintDebug assembleDebug
          RESULT=$?
          if [ "$RESULT" -ne 0 ]; then
            echo "===== RAPPORT LINT COMPLET ====="
            REPORT=$(find app/build -type f -name 'lint-results-debug.txt' -o -name 'lint-results*.txt' | head -n 1)
            if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
              cat "$REPORT"
            else
              REPORT=$(find app/build -type f -path '*lintReportDebug*' -name '*.txt' | head -n 1)
              if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then cat "$REPORT"; fi
            fi
            exit "$RESULT"
          fi

      - name: Obtain permanent signing key
        shell: bash
        env:
          SIGNING_VAULT_URL: https://gflnvlolwqnvzxyqsrir.supabase.co/functions/v1/remplissage-signing-vault
        run: |
          set -euo pipefail
          OIDC_RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=remplissage-signing")
          OIDC_TOKEN=$(OIDC_RESPONSE="$OIDC_RESPONSE" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['OIDC_RESPONSE'])
          token = data.get('value')
          if not token:
              raise SystemExit('Jeton OIDC GitHub manquant')
          print(token)
          PY
          )

          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "$SIGNING_VAULT_URL" > "$RUNNER_TEMP/remplissage-vault.json"

          python3 - <<'PY'
          import base64, json, os, pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          data = json.loads((temp / 'remplissage-vault.json').read_text())
          raw = base64.b64decode(data['keystoreBase64'])
          password = data['password']
          if len(raw) < 1000 or not password:
              raise SystemExit('Matériel de signature reçu invalide')
          (temp / 'remplissage-release.jks').write_bytes(raw)
          (temp / 'remplissage-password.txt').write_text(password)
          PY
          chmod 600 "$RUNNER_TEMP/remplissage-release.jks" "$RUNNER_TEMP/remplissage-password.txt"
          rm -f "$RUNNER_TEMP/remplissage-vault.json"

      - name: Build permanently signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/remplissage-release.jks"
          export ANDROID_KEYSTORE_PASSWORD="$(cat "$RUNNER_TEMP/remplissage-password.txt")"
          ./gradlew assembleRelease

      - name: Verify permanent signer
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner introuvable"
            exit 1
          fi
          VERIFY_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$APK")
          printf '%s\n' "$VERIFY_OUTPUT"
          ACTUAL=$(printf '%s\n' "$VERIFY_OUTPUT" \
            | sed -n 's/^.*Signer: certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr -d ':' \
            | tr '[:lower:]' '[:upper:]')
          EXPECTED="B5BBDB2521ACE477BBC1AA2F431ADDE7061268A38E267331FCB67D1E97640AFD"
          if [ -z "$ACTUAL" ]; then
            echo "Impossible de lire l’empreinte SHA-256 du certificat"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Mauvaise clé de signature. Attendu: $EXPECTED ; obtenu: $ACTUAL"
            exit 1
          fi
          echo "Signature permanente vérifiée: $ACTUAL"

      - name: Prepare signed APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="Remplissage-papier-officiel-v${{ steps.version.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "$SHA  $APK" > "$APK.sha256"
          echo "APK SHA-256: $SHA"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Remplissage-papier-officiel-APK-v${{ steps.version.outputs.version }}
          path: |
            Remplissage-papier-officiel-v${{ steps.version.outputs.version }}.apk
            Remplissage-papier-officiel-v${{ steps.version.outputs.version }}.apk.sha256
          if-no-files-found: error

      - name: Verify this is still the latest commit
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          HEAD_MAIN=$(git rev-parse origin/main)
          if [ "$HEAD_MAIN" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Un commit plus récent existe, publication ignorée."
          fi

      - name: Publish signed GitHub Release for in-app update
        if: github.ref == 'refs/heads/main' && steps.latest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          APK="Remplissage-papier-officiel-v${{ steps.version.outputs.version }}.apk"
          SHA="${{ steps.apk.outputs.sha256 }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTING_TARGET=$(gh release view "$TAG" --json targetCommitish --jq '.targetCommitish')
            if [ "$EXISTING_TARGET" != "$GITHUB_SHA" ]; then
              echo "Une Release $TAG existe déjà pour un autre commit ($EXISTING_TARGET)."
              echo "Incrémentez versionName/versionCode avant de republier."
              exit 1
            fi
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --target "$GITHUB_SHA" \
              --title "Remplissage Papier Officiel $TAG" \
              --notes "APK Android signé avec la clé permanente. VersionCode ${{ steps.version.outputs.version_code }}. SHA-256: $SHA. Empreinte certificat: B5:BB:DB:25:21:AC:E4:77:BB:C1:AA:2F:43:1A:DD:E7:06:12:68:A3:8E:26:73:31:FC:B6:7D:1E:97:64:0A:FD."
          fi

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/remplissage-release.jks" \
                "$RUNNER_TEMP/remplissage-password.txt" \
                "$RUNNER_TEMP/remplissage-vault.json"
