name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: android-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName ['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Impossible de lire versionName dans app/build.gradle"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version détectée: $VERSION"

      - name: Compile check
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Obtain permanent signing key
        shell: bash
        env:
          SIGNING_VAULT_URL: https://gflnvlolwqnvzxyqsrir.supabase.co/functions/v1/remplissage-signing-vault
        run: |
          set -euo pipefail
          OIDC_RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=remplissage-signing")
          OIDC_TOKEN=$(OIDC_RESPONSE="$OIDC_RESPONSE" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['OIDC_RESPONSE'])
          token = data.get('value')
          if not token:
              raise SystemExit('Jeton OIDC GitHub manquant')
          print(token)
          PY
          )

          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "$SIGNING_VAULT_URL" > "$RUNNER_TEMP/remplissage-vault.json"

          python3 - <<'PY'
          import base64, json, os, pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          data = json.loads((temp / 'remplissage-vault.json').read_text())
          raw = base64.b64decode(data['keystoreBase64'])
          (temp / 'remplissage-release.jks').write_bytes(raw)
          (temp / 'remplissage-password.txt').write_text(data['password'])
          if len(raw) < 1000:
              raise SystemExit('Keystore reçu invalide')
          PY
          chmod 600 "$RUNNER_TEMP/remplissage-release.jks" "$RUNNER_TEMP/remplissage-password.txt"
          rm -f "$RUNNER_TEMP/remplissage-vault.json"

      - name: Build permanently signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/remplissage-release.jks"
          export ANDROID_KEYSTORE_PASSWORD="$(cat "$RUNNER_TEMP/remplissage-password.txt")"
          ./gradlew assembleRelease

      - name: Verify permanent signer
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner introuvable"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          EXPECTED="B5BBDB2521ACE477BBC1AA2F431ADDE7061268A38E267331FCB67D1E97640AFD"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Mauvaise clé de signature. Attendu: $EXPECTED ; obtenu: $ACTUAL"
            exit 1
          fi
          echo "Signature permanente vérifiée: $ACTUAL"

      - name: Prepare signed APK
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Remplissage-papier-officiel-v${{ steps.version.outputs.version }}.apk"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Remplissage-papier-officiel-APK-v${{ steps.version.outputs.version }}
          path: Remplissage-papier-officiel-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Verify this is still the latest commit
        id: latest
        shell: bash
        run: |
          git fetch origin main --depth=1
          HEAD_MAIN=$(git rev-parse origin/main)
          if [ "$HEAD_MAIN" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Un commit plus récent existe, publication ignorée."
          fi

      - name: Publish signed GitHub Release for in-app update
        if: github.ref == 'refs/heads/main' && steps.latest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          APK="Remplissage-papier-officiel-v${{ steps.version.outputs.version }}.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "Remplissage Papier Officiel $TAG" \
              --notes "Version stabilité $TAG. APK signé avec la clé permanente de l'application pour les futures mises à jour internes."
          fi

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/remplissage-release.jks" \
                "$RUNNER_TEMP/remplissage-password.txt" \
                "$RUNNER_TEMP/remplissage-vault.json"
