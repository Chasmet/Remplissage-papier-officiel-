plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chasmet.remplissagepapierofficiel'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chasmet.remplissagepapierofficiel'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        ciSigning {
            def ks = System.getenv('ANDROID_KEYSTORE_FILE')
            if (ks != null && !ks.isBlank()) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: ''
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: ''
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                signingConfig signingConfigs.ciSigning
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                signingConfig signingConfigs.ciSigning
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
