plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chasmet.remplissagepapierofficiel'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chasmet.remplissagepapierofficiel'
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName '2.0.0'
    }

    signingConfigs {
        permanentRelease {
            def ks = System.getenv('ANDROID_KEYSTORE_FILE')
            def password = System.getenv('ANDROID_KEYSTORE_PASSWORD')
            if (ks != null && !ks.isBlank() && password != null && !password.isBlank()) {
                storeFile file(ks)
                storePassword password
                keyAlias 'remplissage'
                keyPassword password
            }
        }
    }

    buildTypes {
        debug {
            // Debug builds are compile/test artifacts only and are never published as updates.
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('ANDROID_KEYSTORE_FILE') && System.getenv('ANDROID_KEYSTORE_PASSWORD')) {
                signingConfig signingConfigs.permanentRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
